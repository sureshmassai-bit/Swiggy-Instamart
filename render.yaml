# One-click deploy on Render (https://render.com): New + > Blueprint > pick this repository.
# The service name becomes the public address, https://instamartcopilot.onrender.com (if the name is free).
services:
  - type: web
    name: instamartcopilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.data_pipeline
    startCommand: gunicorn webapp.wsgi:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: INSTAMART_PUBLIC_HTTPS
        value: "1"
      - key: INSTAMART_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13.0"
