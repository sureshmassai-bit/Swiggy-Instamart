/* ---------- demo-grade triage: masks PII, then classifies by keyword (not the Part C model) ---------- */
function mask(t){ return t.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,"[EMAIL]").replace(/\b[6-9]\d{9}\b/g,"[PHONE]").replace(/ORD-\d{6}|WEB-\d{6}/g,"[ORDER_ID]"); }
function triage(text, premium){
  const m = mask(text).toLowerCase();
  const cat = /fraud|unauthori[sz]ed|stolen|scam/.test(m) ? "fraud" : /charge|refund|payment|bill|invoice|deduct/.test(m) ? "billing"
    : /late|deliver|rider|missing|arriv|cancel/.test(m) ? "delivery" : /app|crash|login|error|bug|otp/.test(m) ? "technical" : "";
  const route = !cat ? "human_review" : cat === "fraud" ? "security_team" : premium ? "premium_desk" : "support_queue";
  return {masked: mask(text), category: cat, route, priority: (route==="security_team"||route==="premium_desk") ? "HIGH" : "NORMAL"};
}


/* ---------- support bot: answers from the policy text first; a person only gets what it cannot resolve ---------- */
const POLICIES = {"delivery_policy.txt": "Delivery Policy. Standard delivery is promised within 30 minutes of order confirmation in all supported cities. The supported cities are Chennai, Mumbai, Bengaluru, Delhi, Hyderabad and Pune. A delivery fee of INR 25 is charged on orders below INR 199, and delivery is free on orders of INR 199 or more. During heavy rain the promised time may extend to 60 minutes and the app shows a rain notice. A rider will attempt to contact the customer twice before marking an order as undeliverable. Electronics items are delivered only after the customer shares a one time password with the rider.\n", "escalation_policy.txt": "Escalation Policy. A ticket about fraud or an unauthorized transaction is marked high priority and sent to the security team within 2 hours. Tickets from premium customers are answered within 1 hour, and all other tickets within 24 hours. If an automated assistant cannot resolve a ticket within 6 steps, it must hand the case to a human agent with a short summary. A human agent must call the customer back if such a high-value request is rejected.\n", "payment_policy.txt": "Payment Policy. Customers can pay using UPI, debit card, credit card or cash on delivery. Cash on delivery is available only for orders up to INR 2500. If a payment fails but money is deducted, the amount is returned automatically within 48 hours. A customer who sees two charges for one order should raise a billing ticket with the order identifier. Wallet balance can be used for any order and is never refunded as cash. Coupons cannot be combined with wallet balance on the same order.\n", "privacy_policy.txt": "Privacy Policy. Customer phone numbers and email addresses are used only for order updates and support. Support tickets are processed with personal details masked before any automated tool reads them. Delivery addresses are deleted from active systems 180 days after the last order. A customer can ask for account deletion and the request is completed within 30 days. Payment card numbers are never stored by the support system.\n", "refund_policy.txt": "Refund Policy. A refund can be requested only for orders whose status is completed. Orders with status cancelled were never charged, so no refund applies to them. If a completed order is delivered in more than 45 minutes, the customer receives a full refund of the order amount. If a completed order is delivered in 45 minutes or less, no late-delivery refund is paid. Refunds up to INR 1000 are approved automatically by the support system. A refund above INR 1000 must be approved by a human support lead before money is returned. Approved refunds are credited to the original payment method within 5 working days. A refund request must be raised within 7 days of the delivery date.\n"};
const BOT = {name:"Instamart Copilot Assistant", MIN:0.30, sentences:[], idf:{}};
const STOP = new Set("a an the of to in on at is are was were be been it its this that these those for from by with and or as if then than so do does did can could should would will you your i my me we our they their there what which who when how why not no any all more most other such only own same too very just about into over after before under again further once here both each few up down out off own s t".split(" "));
const stem = w => w.length>4 ? w.replace(/(ing|ed|es|s)$/,"") : w;
const toks = s => (s.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w => !STOP.has(w)).map(stem);
(function buildBot(){
  const docs = [];
  for (const [file, text] of Object.entries(POLICIES)){
    for (const s of text.replace(/\s+/g," ").split(/(?<=[.!?])\s+/)) if (s.split(" ").length >= 5 && !/Policy\.$/.test(s)) docs.push({file, s:s.trim(), t:toks(s)});
  }
  const df = {}; docs.forEach(d => new Set(d.t).forEach(w => df[w] = (df[w]||0)+1));
  const N = docs.length; BOT.idf = Object.fromEntries(Object.entries(df).map(([w,c]) => [w, Math.log((N+1)/(c+1))+1]));
  const vec = t => { const v = {}; t.forEach(w => v[w] = (v[w]||0)+1); let n = 0; for (const w in v){ v[w] = (1+Math.log(v[w]))*(BOT.idf[w]||1.5); n += v[w]*v[w]; } n = Math.sqrt(n)||1; for (const w in v) v[w] /= n; return v; };
  BOT.vec = vec; docs.forEach(d => d.v = vec(d.t)); BOT.sentences = docs;
})();
const SECTION = {"refund_policy.txt":"Refunds","delivery_policy.txt":"Delivery","payment_policy.txt":"Payments","privacy_policy.txt":"Privacy","escalation_policy.txt":"Support"};
const WANTS_HUMAN = /\b(human|agent|person|manager|supervisor|call me|call back|speak to|talk to)\b/i;
const REF = /\bo[a-z0-9]{7,}\b/gi;
const MAX_REPLIES = 6, PROMISE = 30, RAIN = 60;
const UNHAPPY = /\b(still|not (solved|resolved|working|helpful|received|refunded|returned|found|got)|didn'?t help|doesn'?t help|useless|no use|worst|nothing (happened|changed))\b/i;
const NOUN = "item|items|product|products|food|milk|bread|egg|eggs|vegetable|vegetables|fruit|fruits|curd|rice|oil|snacks|packet|pack|order";
const BAD = "missing|wrong|damaged|expired|rotten|spoil\\w*|broken|leak\\w*|stale|short|incomplete|torn|open(ed)?";
const INTENTS = [
  ["rider", /\b(rude|misbehav\w*|abus\w*|shout\w*|impolite|harass\w*)\b/i],
  ["item", new RegExp("\\b(" + BAD + ")\\b.*\\b(" + NOUN + ")\\b|\\b(" + NOUN + ")\\b.*\\b(" + BAD + ")\\b", "i")],
  ["payment_double", /\b(charged twice|double (charge|charged|payment)|two charges|paid twice|charged two)\b/i],
  ["payment_failed", /\b(deduct\w*|debited|payment (failed|issue|problem)|money (cut|gone|taken)|amount (cut|deducted))\b/i],
  ["refund", /\brefund\w*|money back\b/i],
  ["cancel", /\bcancel\w*\b/i],
  ["delivery", /(not (getting|received|delivered|arrived|come|coming)|haven'?t (got|received)|didn'?t (get|receive|arrive)|never (came|arrived|received)|where('?s| is) my|track|\blate\b|delay\w*|still waiting|yet to|when will|not yet|(is|was) not delivered)/i],
];
const PROBLEM = /\b(my (order|delivery|item|items|payment|food|money|refund)|i (was|am|got|ordered|paid|received)|i'?m|i'?ve|didn'?t|haven'?t|not getting|never|order (is|was|has)|it (is|was|has))\b/i;
const QUESTION = /^\W*(what|how|when|is|are|can|does|do|why|who|which|will|after|on|where)\b/i;
const IN_PROGRESS = {placed:"placed and waiting to be packed", packed:"packed and waiting for a rider", out_for_delivery:"out for delivery with a rider"};
const tail = x => " " + x;
const lineOf = o => `${o.ref} · ${inr(o.amount)} · ${pretty(o.status)} · ${String(o.createdAt).slice(0,10)}`;
const ageMin = (o, now) => { const t = Date.parse(o.createdAt); return isNaN(t) ? null : Math.max(0, Math.floor((now - t) / 60000)); };
function botRetrieve(q, k=3){
  const v = BOT.vec(toks(q));
  return BOT.sentences.map(d => { let s = 0; for (const w in v) if (d.v[w]) s += v[w]*d.v[w]; return {score:s, s:d.s, file:d.file}; }).sort((a,b) => b.score-a.score).slice(0,k);
}
function botHandover(lead, texts, orders, reason, order){
  order = order || botResolve(texts, orders, "delivery")[0];
  const told = texts.slice(-2).map(t => t.trim()).join(" / ").slice(0,160);
  const summary = order ? `order ${order.ref} (${pretty(order.status)}, ${inr(order.amount)}); ` : "";
  return {handled:false, ask:false, reason, reply:`${lead}I'm passing this to a support agent with a short summary: ${summary}you told me “${told}”. Press “Create a ticket” below and an agent will reply on the ticket, so you won't have to repeat anything.`};
}
function botIntent(texts){
  const latest = texts[texts.length-1];
  for (const [name, rx] of INTENTS) if (rx.test(latest)) return name;
  const short = latest.split(/\s+/).length <= 4 || /\bo[a-z0-9]{7,}\b/i.test(latest);
  if (short) for (const earlier of texts.slice(0,-1).reverse()) for (const [name, rx] of INTENTS) if (rx.test(earlier)) return name;
  return null;
}
function botResolve(texts, orders, intent){
  for (const t of [...texts].reverse()) for (const m of (t.match(REF)||[])) { const hit = orders.find(o => o.ref === m.toUpperCase().slice(0,9)); if (hit) return [hit, false]; }
  const latest = texts[texts.length-1].trim(), m = latest.match(/^\W*#?\s*([1-4])\W*$/);
  if (m && +m[1] <= orders.length) return [orders[+m[1]-1], false];
  if (orders.length && /\b(first|latest|last|recent|newest|this one|that one|my order)\b/i.test(latest)) return [orders[0], false];
  if (intent === "delivery" || intent === "cancel"){ const live = orders.filter(o => IN_PROGRESS[o.status]); if (live.length === 1) return [live[0], true]; }
  return [null, false];
}
function botAskWhich(orders, prior, charged){
  if (!orders.length){ if (prior >= 1) return null; return {handled:true, ask:true, reason:"ask", reply:"I can't see any orders on your account yet. Please type the order id and tell me what went wrong, and I'll check it for you."}; }
  const lines = orders.slice(0,4).map((o,i) => `${i+1}) ${lineOf(o)}`);
  return {handled:true, ask:true, reason:"ask", reply:`I'm sorry about that, let's sort it out. ${charged ? "Which order were you charged twice for?" : "Which order is this about?"} Reply with its number or type the order id:\n` + lines.join("\n")};
}
function botOrderFlow(intent, texts, orders, prior, now){
  const R = (handled, reply, extra) => ({handled, ask:false, reason:"answered", reply, ...extra});
  if (intent === "payment_failed") return R(true, "If a payment fails but money is deducted, the amount is returned automatically within 48 hours. Please wait for that window; if it has already passed, reply “still not refunded” and I'll pass it to a billing agent with the details.  [Payments]");
  const [order, assumed] = botResolve(texts, orders, intent);
  if (intent === "payment_double"){
    if (!order){ const ask = botAskWhich(orders, prior, true); return ask || botHandover("A double charge needs a billing ticket with the order id. ", texts, orders, "needs_agent"); }
    return botHandover(`Thanks. I have the order: ${lineOf(order)}. Payment policy says a double charge goes to billing with the order id, and I can't reverse a charge myself. `, texts, orders, "needs_agent", order);
  }
  if (!order) return botAskWhich(orders, prior, false) || botHandover("I could not find that order. ", texts, orders, "needs_agent");
  const head = `I found your order ${lineOf(order)}. `, st = order.status, age = ageMin(order, now);
  if (st === "cancelled") return R(true, head + "It was cancelled, so you were never charged and no refund applies.  [Refunds]");
  if (intent === "cancel"){
    if (st === "placed") return R(true, head + "It's still “placed”, so you can cancel it yourself: open My orders and press Cancel next to it. A cancelled order is never charged.  [Refunds]");
    if (IN_PROGRESS[st]) return botHandover(head + `It is already ${IN_PROGRESS[st]}, and the app can only cancel orders that are still “placed”. `, texts, orders, "needs_agent", order);
    return R(true, head + "It has already been delivered, so it can't be cancelled. If something was wrong with it, tell me what.  [Refunds]");
  }
  if (intent === "rider" || intent === "item"){
    const what = intent === "rider" ? "the rider's behaviour" : "the problem with the items";
    return botHandover(head + `Thank you for telling me about ${what}; I'm sorry. I can't approve compensation or a replacement myself. `, texts, orders, "needs_agent", order);
  }
  if (intent === "refund"){
    if (IN_PROGRESS[st]) return R(true, head + "Refunds apply only to completed orders, and this one is not delivered yet. If it is taking too long, tell me and I'll look at the delivery.  [Refunds]");
    return {...R(true, head + "A refund can be requested only for completed orders, within 7 days of delivery. Late deliveries (more than 45 minutes) get a full refund. Tell me what went wrong with this order and I'll take it from there.  [Refunds]"), ask:true};
  }
  if (IN_PROGRESS[st]){
    const where = `It is ${IN_PROGRESS[st]}.`;
    if (age === null) return R(true, head + where + " Delivery is promised within 30 minutes of confirmation, up to 60 in heavy rain, and the rider will call you twice, so please keep your phone nearby.  [Delivery]");
    if (age <= PROMISE) return R(true, head + where + ` It was placed ${age} minute(s) ago, which is inside our ${PROMISE}-minute delivery promise, so it should reach you soon. The rider will try to call you up to twice, so please keep your phone nearby.  [Delivery]`);
    if (age <= RAIN) return R(true, head + where + ` It was placed ${age} minutes ago, past the ${PROMISE}-minute promise, but in heavy rain delivery can take up to ${RAIN} minutes, so please allow about ${RAIN-age} more minutes. If it hasn't arrived by then, reply “still not received” and I'll pass it to an agent.  [Delivery]`);
    return botHandover(head + where + ` It was placed ${age} minutes ago, beyond even the ${RAIN}-minute rain limit, and I'm sorry. I can't speed up a rider myself` + (st === "placed" ? ", but you can also cancel it from My orders while it is “placed”" : "") + ". ", texts, orders, "needs_agent", order);
  }
  return {...R(true, head + "It is marked as delivered. Please check with anyone at home, the security desk or neighbours. If it truly did not reach you, reply “still not received” and I'll pass it to an agent right away.  [Delivery]"), ask:true};
}
function botPolicy(texts, prior, orders){
  const hits = botRetrieve(texts.slice(-2).join(" ")).filter(h => h.score >= BOT.MIN).slice(0,2);
  if (!hits.length){
    if (prior === 0) return {handled:true, ask:true, reason:"ask", reply:"I want to get this right. Is it about an order (a late, missing or wrong delivery), a payment, a refund, or your account? A few more details help me fix it."};
    return botHandover("I could not find this in our policies. ", texts, orders, "low_confidence");
  }
  const lines = ["Here is what I found:", ...hits.map(h => "• " + h.s + "  [" + (SECTION[h.file]||h.file) + "]"), "Did this solve it? If not, press “Not solved – create a ticket” and a support agent will take over."];
  return {handled:true, ask:false, reason:"answered", reply:lines.join("\n")};
}
function botRespond(texts, category, orders, prior, forceHuman, now){
  texts = (typeof texts === "string" ? [texts] : texts).filter(t => t && t.trim()); if (!texts.length) texts = [""];
  const latest = texts[texts.length-1].trim(); now = now || Date.now();
  if (category === "fraud") return {handled:false, ask:false, reason:"fraud", reply:"This looks like a possible fraud or unauthorised transaction, so I have passed it to our security team right away. A person will contact you within 2 hours. Please do not share OTPs or card details with anyone in the meantime."};
  if (forceHuman || WANTS_HUMAN.test(latest)) return botHandover("Understood. ", texts, orders, "asked_for_human");
  if (prior >= MAX_REPLIES) return botHandover("I have not been able to settle this within a few steps. ", texts, orders, "step_limit");
  if (prior >= 1 && UNHAPPY.test(latest)) return botHandover("I'm sorry that did not fix it. ", texts, orders, "still_unresolved");
  const intent = (QUESTION.test(latest) && !PROBLEM.test(latest)) ? null : botIntent(texts);
  return intent ? botOrderFlow(intent, texts, orders, prior, now) : botPolicy(texts, prior, orders);
}
const botOrders = customerId => orders.filter(o => o.customerId === customerId).map(o => ({ref:o.id.toUpperCase().slice(0,9), status:o.status, amount:o.amount, createdAt:o.createdAt}));

/* ---------- auth: PBKDF2-SHA256 in the browser against the stored salt and hash ---------- */
async function hashPw(pw, salt, iter){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:new TextEncoder().encode(salt), iterations:iter}, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,"0")).join("");
}
async function signIn(username, pw){
  const snap = await db.doc("accounts/" + username).get();
  const a = snap.exists ? snap.data() : null;
  const h = a ? await hashPw(pw, a.salt, a.iter) : await hashPw(pw, "x", 1000);
  if (!a || h !== a.hash) return null;
  return a;
}

const chatAdd = (who, text) => { chat.msgs.push({who, text}); const d = document.createElement("div"); d.className = "cm " + who; d.textContent = text; const l = document.getElementById("chat-log"); l.appendChild(d); l.scrollTop = l.scrollHeight; };
function chatBtn(label, cls, fn, href){ const b = document.createElement(href ? "a" : "button"); if (href){ b.href = "#"; b.className = "btn"; } else { b.type = "button"; b.className = cls||""; } b.textContent = label; b.onclick = e => { e.preventDefault(); fn(); }; document.getElementById("chat-actions").appendChild(b); }
function chatOpen(){ chatSync(); chat.open = true; document.getElementById("chat-panel").hidden = false; const f = document.getElementById("chat-fab"); f.hidden = true; f.setAttribute("aria-expanded","true");
  if (!chat.msgs.length) chatAdd("bot", "Hi! I'm the Instamart Copilot assistant. Ask me about orders, refunds, delivery, payments or privacy and I'll try to sort it out. If I can't, I'll raise a ticket for a support agent."); document.getElementById("chat-input").focus(); }
function chatClose(){ chat.open = false; document.getElementById("chat-panel").hidden = true; const f = document.getElementById("chat-fab"); f.hidden = false; f.setAttribute("aria-expanded","false"); }

function chatOffer(handled){ const a = document.getElementById("chat-actions"); a.textContent = "";

async function chatSend(e){

  const users = chat.msgs.filter(m => m.who==="user").map(m => m.text).slice(-21);

async function chatTicket(){

    await db.doc("tickets/"+id).set({customerId:me.customerId, username:me.username, subject, body, ...tri, status:"open", handledBy:"human", fromChat:true, createdAt:now, updatedAt:now,
      thread: chat.msgs.slice(0,40).map(m => m.who==="user" ? {role:"user", name:me.fullName, text:m.text, at:now} : {role:"bot", name:BOT.name, text:m.text, at:now})});
    chat.finished = true; chatAdd("bot", "Done. Ticket " + id.toUpperCase().slice(0,9) + " has been created with this whole conversation, so you won't need to repeat anything. A support agent will reply on the ticket.");
    chatBtn("View ticket","",() => { chatClose(); view = "tickets"; sel = id; render(); }, true); chatBtn("New chat","ghost",() => { chatReset(); chatOpen(); });
  } catch(e){ chatAdd("bot", e && e.code === "invalid_argument" ? "Your account can view this demo but not change data. Ask the owner for Contributor access." : "Sorry, the ticket could not be created. Please try again."); chatOffer(false); }
  chat.busy = false;
}

/* ---------- views ---------- */
function shell(body){
  const adminTabs = [["home","Dashboard"],["customers","Customers"],["orders","Orders"],["tickets","Tickets"]];
  const userTabs = [["home","Home"],["shop","Order products"],["orders","My orders"],["tickets","Support tickets"]];
  const tabs = me ? (me.role==="admin"?adminTabs:userTabs) : [];
  const note = ui.note ? `<div class="notice ${ui.note.kind}" role="status" style="margin-bottom:14px">${esc(ui.note.msg)}</div>` : "";
  return `<header class="bar"><span class="brand">Instamart <b>Copilot</b></span>
    ${tabs.map(([k,l]) => `<button class="tab" data-act="nav" data-v="${k}" ${view===k?'aria-current="page"':""}>${l}</button>`).join("")}
    <span class="grow"></span>${me ? `<span class="who">${esc(me.fullName)} · ${esc(me.role)}</span><button class="ghost" data-act="logout">Sign out</button>` : ""}</header>${note}${body}`;
}
function loginView(){
  const msg = dbState==="connecting" ? "Connecting to the demo database…" : dbState==="unavailable" ? "The demo database is not available. Open this page while signed in to claude.ai." : dbState.startsWith("error") ? "The demo database returned an error (" + esc(dbState.slice(6)) + ")." : "";
  return shell(`<div class="auth card"><h1>Sign in</h1><p class="muted small">Hosted demo with fictional customers. Accounts are created by the project owner.</p>
    ${msg ? `<div class="notice">${msg}</div>` : ""}
    <form id="login"><label for="u">Username</label><input id="u" name="u" autocomplete="username" required autofocus>
    <label for="p">Password</label><input id="p" name="p" type="password" autocomplete="current-password" required>
    <p><button type="submit" ${dbState==="ready"?"":"disabled"}>Sign in</button></p></form></div>`);
}
function userHome(){
  const c = CUST[me.customerId], mine = orders.filter(o => o.customerId===me.customerId), tix = tickets.filter(t => t.customerId===me.customerId);
  return shell(`<h1>Welcome, ${esc(me.fullName)}</h1><div class="stack" style="margin-top:14px">
  <div class="stats"><div class="stat"><b>${c.pastOrders + mine.length}</b><span>orders placed (history + here)</span></div>
   <div class="stat"><b>${inr(c.revenue)}</b><span>completed-order spend (history)</span></div>
   <div class="stat"><b>${tix.filter(t=>t.status!=="closed").length}</b><span>open tickets</span></div>
   <div class="stat"><b>${esc(c.segment)}</b><span>your customer segment</span></div></div>
  <div class="card"><h2>Your profile</h2><table><tr><th>Customer ID</th><td>${esc(c.id)}</td></tr><tr><th>City</th><td>${esc(c.city)}</td></tr><tr><th>Age / gender</th><td>${c.age} / ${esc(c.gender)}</td></tr></table></div>
  <div class="row"><div class="fit"><button data-act="nav" data-v="shop">Order products</button></div><div class="fit"><button class="ghost" data-act="chatopen">💬 Get help</button></div></div></div>`);
}
function shopView(){
  const items = PRODUCTS.filter(p => !ui.cat || p.category===ui.cat);
  return shell(`<h1>Order products</h1><p style="margin:12px 0">${["",...CATS].map(c => `<button class="${ui.cat===c?"":"ghost"}" data-act="cat" data-c="${esc(c)}" style="margin:0 6px 6px 0">${c||"All"}</button>`).join("")}</p>
  <div class="prods">${items.map(p => `<div class="card prod"><span class="chip" style="align-self:flex-start">${esc(p.category)}</span><h3>${esc(p.name)}</h3><span class="price">${inr(p.price)}</span>
   <div class="row" style="margin-top:auto"><div><label for="q-${p.id}">Quantity</label><input id="q-${p.id}" type="number" min="1" max="20" value="1"></div><div class="fit"><button data-act="order" data-p="${p.id}">Place order</button></div></div></div>`).join("")}</div>`);
}
function myOrders(){
  const mine = orders.filter(o => o.customerId===me.customerId);
  return shell(`<h1>My orders</h1><div class="card tw" style="margin-top:14px"><table><tr><th>Order</th><th>Product</th><th>Qty</th><th>Amount</th><th>Placed</th><th>Status</th><th></th></tr>
  ${mine.map(o => `<tr><td>${esc(o.id.toUpperCase().slice(0,9))}</td><td>${esc(o.name)}${o.sample?' <span class="chip">example</span>':""}</td><td>${o.qty}</td><td>${inr(o.amount)}</td><td class="small">${esc(when(o.createdAt))}</td><td>${chip(o.status)}</td>
   <td>${o.status==="placed"?`<button class="ghost" data-act="cancel" data-o="${o.id}">Cancel</button>`:""}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">No orders yet. Pick something from Order products.</td></tr>`}</table></div>
  <p class="small muted">Earlier order history (${CUST[me.customerId].pastOrders} orders) comes from the project's cleaned Part A data.</p>`);
}
function threadHtml(t){ return t.thread.map(m => `<div class="msg ${m.role}"><div class="meta">${m.role==="bot" ? "🤖 "+BOT.name+" (bot)" : esc(m.name)+" ("+(m.role==="admin"?"support team":"customer")+")"} · ${esc(when(m.at))}</div>${esc(m.text)}</div>`).join(""); }
function ticketDetail(t, admin){
  const canReply = admin || t.status !== "closed";
  const c = CUST[t.customerId];
  return `<div class="cols"><div class="card"><h2>${esc(t.id.toUpperCase().slice(0,9))} · ${esc(t.subject)}</h2>${threadHtml(t)}
   ${canReply ? `<form id="reply"><label for="rm">${admin?"Reply to customer":"Add a follow-up"}</label><textarea id="rm" required maxlength="2000"></textarea><p><button type="submit">Send</button></p></form>` : `<p class="muted">This ticket is closed.</p>`}</div>
   <div class="card"><h2>Details</h2><table><tr><th>Status</th><td>${chip(t.status)}</td></tr><tr><th>Raised</th><td class="small">${esc(when(t.createdAt))}</td></tr>
   ${admin ? `<tr><th>Customer</th><td>${esc(t.customerId)} (${esc(c?c.segment:"")})</td></tr><tr><th>Auto category</th><td>${esc(t.category||"not classified")}</td></tr>
   <tr><th>Route</th><td>${esc(pretty(t.route))} ${t.priority==="HIGH"?'<span class="chip hi">HIGH</span>':""}</td></tr>
   <tr><th>Text a model would see</th><td class="small">${esc(t.masked)}</td></tr>` : ""}</table>
   ${admin ? `<form id="status" class="row" style="margin-top:12px"><div><label for="st">Set status</label><select id="st">${TICKET_ST.map(s => `<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select></div><div class="fit"><button class="ghost" type="submit">Update</button></div></form>` : ""}
   <p style="margin-top:12px"><button class="ghost" data-act="back">Back to list</button></p></div></div>`;
}
function myTickets(){
  if (sel){ const t = tickets.find(x => x.id===sel && x.customerId===me.customerId); if (t) return shell(ticketDetail(t,false)); sel = null; }
  const mine = tickets.filter(t => t.customerId===me.customerId);
  return shell(`<h1>Support tickets</h1><div class="cols" style="margin-top:14px"><div class="card"><h2>Need help?</h2><p>Tap the <b>💬 Help</b> bubble at the bottom right. Our assistant answers questions about orders, refunds, delivery and payments straight away.</p><p>If it cannot solve your problem, one tap turns the conversation into a ticket for a support agent, so you never have to explain twice.</p><p><button data-act="chatopen">Open help chat</button></p></div>
   <div class="card tw"><h2>Your tickets</h2><table><tr><th>Ticket</th><th>Subject</th><th>Status</th></tr>
   ${mine.map(t => `<tr class="pick" data-act="open" data-t="${t.id}"><td>${esc(t.id.toUpperCase().slice(0,9))}</td><td>${esc(t.subject)}${t.sample?' <span class="chip">example</span>':""}</td><td>${chip(t.status)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">No tickets yet.</td></tr>`}</table></div></div>`);
}
function adminHome(){
  const open = tickets.filter(t => t.status==="open");
  return shell(`<h1>Admin dashboard</h1><div class="stack" style="margin-top:14px"><div class="stats">
   <div class="stat"><b>${CUSTOMERS.length}</b><span>customers (Part A data)</span></div><div class="stat"><b>${open.length}</b><span>need a person (${open.filter(t=>t.priority==="HIGH").length} high priority)</span></div><div class="stat"><b>${chats.filter(c=>c.outcome==="solved").length}</b><span>chats solved by the assistant (${tickets.filter(t=>t.fromChat).length} became tickets)</span></div>
   <div class="stat"><b>${orders.length}</b><span>orders placed here</span></div><div class="stat"><b>${inr(orders.filter(o=>o.status!=="cancelled").reduce((s,o)=>s+o.amount,0))}</b><span>value of orders placed here</span></div></div>
   <div class="card tw"><h2>Waiting for a person</h2><table><tr><th>Ticket</th><th>Customer</th><th>Subject</th><th>Category</th><th>Priority</th></tr>
   ${open.slice(0,8).map(t => `<tr class="pick" data-act="openadmin" data-t="${t.id}"><td>${esc(t.id.toUpperCase().slice(0,9))}</td><td>${esc(t.customerId)}</td><td>${esc(t.subject)}</td><td>${esc(t.category||"—")}</td><td>${t.priority==="HIGH"?'<span class="chip hi">HIGH</span>':"Normal"}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Nothing is waiting.</td></tr>`}</table></div></div>`);
}
function adminCustomers(){
  if (sel && CUST[sel]){
    const c = CUST[sel], o = orders.filter(x => x.customerId===sel), t = tickets.filter(x => x.customerId===sel);
    return shell(`<p><button class="ghost" data-act="back">&larr; All customers</button></p><h1 style="margin:10px 0 14px">Customer ${esc(c.id)}</h1><div class="stack"><div class="cols">
     <div class="card"><h2>Profile</h2><table><tr><th>City</th><td>${esc(c.city)}</td></tr><tr><th>Age / gender</th><td>${c.age} / ${esc(c.gender)}</td></tr><tr><th>Segment</th><td>${esc(c.segment)}</td></tr></table></div>
     <div class="card"><h2>Order history (Part A)</h2><table><tr><th>Orders</th><td>${c.pastOrders}</td></tr><tr><th>Completed revenue</th><td>${inr(c.revenue)}</td></tr></table></div></div>
     <div class="card tw"><h2>Orders placed here</h2><table><tr><th>Order</th><th>Product</th><th>Qty</th><th>Amount</th><th>Status</th></tr>${o.map(x => `<tr><td>${esc(x.id.toUpperCase().slice(0,9))}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${inr(x.amount)}</td><td>${chip(x.status)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">None.</td></tr>`}</table></div>
     <div class="card tw"><h2>Tickets</h2><table><tr><th>Ticket</th><th>Subject</th><th>Status</th></tr>${t.map(x => `<tr class="pick" data-act="openadmin" data-t="${x.id}"><td>${esc(x.id.toUpperCase().slice(0,9))}</td><td>${esc(x.subject)}</td><td>${chip(x.status)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">None.</td></tr>`}</table></div></div>`);
  }
  const q = ui.q.toLowerCase();
  const rows = CUSTOMERS.filter(c => (!q || c.id.toLowerCase().includes(q)) && (!ui.city || c.city===ui.city) && (!ui.seg || c.segment===ui.seg));
  const pages = Math.max(1, Math.ceil(rows.length/PAGE)); ui.page = Math.min(ui.page, pages);
  const slice = rows.slice((ui.page-1)*PAGE, ui.page*PAGE);
  const opt = (list, cur, all) => `<option value="">${all}</option>` + list.map(x => `<option ${x===cur?"selected":""}>${esc(x)}</option>`).join("");
  return shell(`<h1>Customers</h1><form id="filters" class="card row" style="margin:14px 0"><div><label for="fq">Search customer ID</label><input id="fq" value="${esc(ui.q)}"></div>
   <div><label for="fc">City</label><select id="fc">${opt(CITIES,ui.city,"All")}</select></div><div><label for="fs">Segment</label><select id="fs">${opt(SEGS,ui.seg,"All")}</select></div><div class="fit"><button type="submit">Filter</button></div></form>
   <div class="card tw"><table><tr><th>Customer</th><th>City</th><th>Age</th><th>Gender</th><th>Segment</th><th>Past orders</th><th>Revenue</th><th>Here: orders / tickets</th></tr>
   ${slice.map(c => `<tr class="pick" data-act="cust" data-c="${c.id}"><td><a href="#" data-act="cust" data-c="${c.id}">${esc(c.id)}</a></td><td>${esc(c.city)}</td><td>${c.age}</td><td>${esc(c.gender)}</td><td>${esc(c.segment)}</td><td>${c.pastOrders}</td><td>${inr(c.revenue)}</td>
    <td>${orders.filter(o=>o.customerId===c.id).length} / ${tickets.filter(t=>t.customerId===c.id).length}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">No customers match.</td></tr>`}</table>
   <div class="pager small muted"><span>${rows.length} customers · page ${ui.page} of ${pages}</span><span class="grow"></span>${ui.page>1?`<button class="ghost" data-act="pg" data-d="-1">Previous</button>`:""}${ui.page<pages?`<button class="ghost" data-act="pg" data-d="1">Next</button>`:""}</div></div>`);
}
function adminOrders(){
  const rows = orders.filter(o => !ui.orderFilter || o.status===ui.orderFilter);
  return shell(`<h1>Orders placed here</h1><p style="margin:12px 0">${["",...ORDER_ST].map(s => `<button class="${ui.orderFilter===s?"":"ghost"}" data-act="ofilter" data-s="${s}" style="margin:0 6px 6px 0">${s?pretty(s):"All"}</button>`).join("")}</p>
  <div class="card tw"><table><tr><th>Order</th><th>Customer</th><th>Product</th><th>Qty</th><th>Amount</th><th>Placed</th><th>Status</th></tr>
  ${rows.map(o => `<tr><td>${esc(o.id.toUpperCase().slice(0,9))}</td><td>${esc(o.customerId)}</td><td>${esc(o.name)}</td><td>${o.qty}</td><td>${inr(o.amount)}</td><td class="small">${esc(when(o.createdAt))}</td>
   <td><select data-act="ostatus" data-o="${o.id}" aria-label="Order status">${ORDER_ST.map(s => `<option value="${s}" ${s===o.status?"selected":""}>${pretty(s)}</option>`).join("")}</select></td></tr>`).join("") || `<tr><td colspan="7" class="empty">No orders.</td></tr>`}</table></div>`);
}
function adminTickets(){
  if (sel){ const t = tickets.find(x => x.id===sel); if (t) return shell(ticketDetail(t,true)); sel = null; }
  const rows = tickets.filter(t => !ui.ticketFilter || t.status===ui.ticketFilter).sort((a,b) => (b.priority==="HIGH")-(a.priority==="HIGH"));
  return shell(`<h1>Support tickets</h1><p style="margin:12px 0">${["",...TICKET_ST].map(s => `<button class="${ui.ticketFilter===s?"":"ghost"}" data-act="tfilter" data-s="${s}" style="margin:0 6px 6px 0">${s||"All"}</button>`).join("")}</p>
  <div class="card tw"><table><tr><th>Ticket</th><th>Customer</th><th>Subject</th><th>Category</th><th>Route</th><th>Status</th></tr>
  ${rows.map(t => `<tr class="pick" data-act="openadmin" data-t="${t.id}"><td>${esc(t.id.toUpperCase().slice(0,9))}</td><td>${esc(t.customerId)}</td><td>${esc(t.subject)}${t.sample?' <span class="chip">example</span>':""}</td><td>${esc(t.category||"—")}</td><td>${esc(pretty(t.route))}${t.priority==="HIGH"?' <span class="chip hi">HIGH</span>':""}</td><td>${chip(t.status)}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">No tickets.</td></tr>`}</table></div>`);
}
function render(){
  let html;
  if (!me) html = loginView();
  else if (me.role==="admin") html = ({home:adminHome,customers:adminCustomers,orders:adminOrders,tickets:adminTickets}[view]||adminHome)();
  else html = ({home:userHome,shop:shopView,orders:myOrders,tickets:myTickets}[view]||userHome)();
  $app.innerHTML = html;
  chatSync();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; if (el.tagName==="A") e.preventDefault();
  if (a==="nav"){ view = el.dataset.v; sel = null; ui.note = null; ui.page = 1; render(); }
  else if (a==="logout"){ if (chat.el){ chatReset(); chatClose(); } me = null; view = "home"; sel = null; ui.note = null; render(); }
  else if (a==="cat"){ ui.cat = el.dataset.c; render(); }
  else if (a==="order") guarded(async () => {
    const p = PRODUCTS.find(x => x.id===el.dataset.p), qty = parseInt(document.getElementById("q-"+p.id).value, 10);
    if (!(qty >= 1 && qty <= 20)) return say("Quantity must be from 1 to 20.", "err");
    const id = uid("o");
    await db.doc("orders/"+id).set({customerId:me.customerId, username:me.username, productId:p.id, name:p.name, qty, unit:p.price, amount:Math.round(p.price*qty*100)/100, status:"placed", createdAt:new Date().toISOString()});
    say(`Order placed: ${qty} × ${p.name} = ${inr(p.price*qty)}.`);
  });
  else if (a==="cancel") guarded(async () => {
    const o = orders.find(x => x.id===el.dataset.o); if (!o || o.customerId!==me.customerId || o.status!=="placed") return say("Only your own 'placed' orders can be cancelled.", "err");
    await db.doc("orders/"+o.id).update({status:"cancelled"}); say("Order cancelled.");
  });
  else if (a==="open"||a==="openadmin"){ sel = el.dataset.t; if (a==="openadmin"){ view = "tickets"; } ui.note = null; render(); }
  else if (a==="back"){ sel = null; render(); }
  else if (a==="chatopen") chatOpen();
  else if (a==="cust"){ sel = el.dataset.c; render(); }
  else if (a==="pg"){ ui.page += parseInt(el.dataset.d,10); render(); }
  else if (a==="tfilter"){ ui.ticketFilter = el.dataset.s; render(); }
  else if (a==="ofilter"){ ui.orderFilter = el.dataset.s; render(); }
});
document.addEventListener("change", e => {
  const el = e.target; if (el.dataset && el.dataset.act==="ostatus" && me && me.role==="admin")
    guarded(async () => { if (!ORDER_ST.includes(el.value)) return; await db.doc("orders/"+el.dataset.o).update({status:el.value}); say("Order status updated."); });
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target.id;
  if (f==="login") guarded(async () => {
    const u = document.getElementById("u").value.trim().toLowerCase(), p = document.getElementById("p").value;
    const a = await signIn(u, p);
    if (!a) return say("Invalid username or password.", "err");
    me = a; view = "home"; sel = null; ui.note = null; render();
  });
  else if (f==="reply" && me) guarded(async () => {
    const t = tickets.find(x => x.id===sel); const text = document.getElementById("rm").value.trim();
    if (!t || text.length < 2) return say("Write at least 2 characters.", "err");
    if (me.role!=="admin" && (t.customerId!==me.customerId || t.status==="closed")) return say("You cannot reply to this ticket.", "err");
    const now = new Date().toISOString(), thread = [...t.thread, {role:me.role, name:me.fullName, text, at:now}];
    await db.doc("tickets/"+t.id).update({thread, status: me.role==="admin" ? "answered" : "open", handledBy:"human", updatedAt:now});
    say("Reply sent.");
  });
  else if (f==="status" && me && me.role==="admin") guarded(async () => {
    const v = document.getElementById("st").value; if (!TICKET_ST.includes(v)) return;
    await db.doc("tickets/"+sel).update({status:v, updatedAt:new Date().toISOString()}); say("Ticket set to " + v + ".");
  });
  else if (f==="filters"){ ui.q = document.getElementById("fq").value.trim(); ui.city = document.getElementById("fc").value; ui.seg = document.getElementById("fs").value; ui.page = 1; render(); }
});

/* ---------- start: render the sign-in page at once, light the database up when it answers ---------- */
render();
(async () => {
  const timer = setTimeout(() => { if (dbState==="connecting"){ dbState = "unavailable"; render(); } }, 10000);
  try { db = await claude.use("db"); } catch { db = null; }
  clearTimeout(timer);
  if (!db){ dbState = "unavailable"; return render(); }
  dbState = "ready"; listen(); render();
})();
</script>
