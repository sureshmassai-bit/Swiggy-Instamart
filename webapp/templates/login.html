{% extends "base.html" %}{% block title %}Sign in · Instamart Copilot{% endblock %}
{% block body %}<div class="auth card"><h1>Sign in</h1>
<form method="post" autocomplete="on"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label for="u">Username</label><input id="u" name="username" required autofocus autocomplete="username" maxlength="60">
<label for="p">Password</label><input id="p" name="password" type="password" required autocomplete="current-password" maxlength="200">
<p><button type="submit">Sign in</button></p></form>
<p class="small muted">New customer? <a href="{{ url_for('register') }}">Create an account</a>. Administrators are created by the team and cannot self-register.</p></div>{% endblock %}
